[project]
name = "hiremeai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sumit Kumar", email = "sumit973589@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.2",
    "groq>=1.7.0",
    "pydantic>=2.14.1",
